<!--
  ServiceNow UI Page – Risk Assessment Custom
  Table: u_risk_assessment_custom
  URL:   /<page>.do?sys_id=<record_sys_id>
-->
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Risk Assessment</title>
  <link rel="stylesheet" href="38cc377393533690aa1874121bba1014.cssdbx" />
</head>
<body>

<div class="page">

  <div class="page-header">
    <h1>Risk Assessment Custom</h1>
    <span id="recordLabel"></span>
  </div>

  <div id="alertError" class="alert alert-error" style="display:none">
    <span id="alertErrorMsg"></span>
  </div>
  <div id="alertSuccess" class="alert alert-success" style="display:none">
    Record salvato con successo.
  </div>

  <div class="card">

    <div id="loadingBox" class="loading-box">
      <div class="spinner"></div>
      <p>Caricamento…</p>
    </div>

    <div id="riskForm">

      <div class="field" id="wrapImpatto">
        <label for="selImpatto">Impatto Inerente 231 <span class="req">*</span></label>
        <select id="selImpatto" name="u_impatto_inerente231">
          <option value="" disabled="true" selected="true">— Seleziona —</option>
          <option value="basso">Basso</option>
          <option value="medio">Medio</option>
          <option value="alto">Alto</option>
        </select>
        <p class="field-error" id="errImpatto" style="display:none">Campo obbligatorio.</p>
      </div>

      <div class="field" id="wrapProbabilita">
        <label for="selProbabilita">Probabilità Inerente 231 <span class="req">*</span></label>
        <select id="selProbabilita" name="u_probabilita_inerente231">
          <option value="" disabled="true" selected="true">— Seleziona —</option>
          <option value="basso">Bassa</option>
          <option value="medio">Media</option>
          <option value="alto">Alta</option>
        </select>
        <p class="field-error" id="errProbabilita" style="display:none">Campo obbligatorio.</p>
      </div>

      <div class="field">
        <label>Rischio Inerente <span class="auto-badge">automatico</span></label>
        <div id="riskResult" class="risk-result risk-empty">—</div>
      </div>

      <div class="actions">
        <button type="button" id="btnReset" class="btn btn-secondary">Annulla modifiche</button>
        <button type="button" id="btnSave" class="btn btn-primary">Salva</button>
      </div>

    </div>
  </div>
</div>

<script src="risk_assessment_form.js.jsdbx"></script>
</body>
</html>
